<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Đang xây dựng - VivuViet</title>
        <!-- Bootstrap 5.3.3 CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <!-- Bootstrap Icons -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <!-- Global CSS -->
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="icon" href="/favicon.png" type="image/png" />
        <style>
            .coming-soon-wrapper {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
                text-align: center;
                padding: 2rem;
            }
            .coming-soon-icon {
                font-size: 5rem;
                color: var(--primary);
                margin-bottom: 1rem;
                animation: bounce 2s infinite ease-in-out;
            }
            .coming-soon-title {
                font-weight: 800;
                color: var(--primary);
                font-size: 2.5rem;
                margin-bottom: 1rem;
            }
            .coming-soon-desc {
                color: #555;
                max-width: 500px;
                margin-bottom: 2rem;
                line-height: 1.6;
            }
            @keyframes bounce {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-20px);
                }
            }
        </style>
    </head>
    <body>
        <div class="coming-soon-wrapper">
            <a href="/" class="text-decoration-none mb-4">
                <h2 class="vv-brand" style="font-size: 2rem; margin: 0">
                    Vivu<span>Viet</span>
                </h2>
            </a>

            <div class="coming-soon-icon">
                <i class="bi bi-tools"></i>
            </div>

            <h1 class="coming-soon-title">Tính năng đang xây dựng!</h1>
            <p class="coming-soon-desc">
                Hệ thống VivuViet đang trong quá trình nâng cấp và hoàn thiện
                trang này. Vui lòng quay lại sau nhé. Chân thành xin lỗi vì sự
                bất tiện này!
            </p>

            <a href="/" class="btn-brand py-2 px-4 fs-6 text-decoration-none">
                <i class="bi bi-house-door-fill me-2"></i> Trở về Trang chủ
            </a>
        </div>
    </body>
</html>
